name: Verify degree-six calculation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Reproduce and compare the exact calculations
        run: |
          python verification/degree-six.py --matrices observed-matrices.txt > observed-output.txt
          diff -u verification/degree-six-check.txt observed-output.txt
          diff -u verification/degree-six-matrices.txt observed-matrices.txt
